# Project-wide Gradle settings.

# JVM / daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Use AndroidX (Qt 6 relies on it for many Android integrations)
android.useAndroidX=true
android.enableJetifier=true

# NOTE:
# Android Gradle Plugin (AGP) 8.1+ removed the legacy flag:
#   android.bundle.enableUncompressedNativeLibs
#
# Qt's older default Android templates (copied by androiddeployqt when the
# project doesn't provide its own gradle.properties) still set that flag,
# which causes Gradle to fail when using AGP >= 8.1.
#
# This project intentionally does NOT set it. If you need the legacy behavior
# (compressed JNI libs), it's expressed in build.gradle via:
#   android.packagingOptions.jniLibs.useLegacyPackaging

# The following properties may be added/overwritten by androiddeployqt
# (for example: qt6AndroidDir, androidCompileSdkVersion, androidMinSdkVersion).

# Qt CI currently uses compileSdk/targetSdk 35. AGP 8.2.2 warns that it was
# tested up to 34; this is a warning only, but it's noisy in CI logs.
android.suppressUnsupportedCompileSdk=35