name: Build for Windows

#on:
#  push:
#    branches: [ master, ci/windows ]
#  pull_request:
#    branches: [ master, ci/windows ]
#  release:
#    types: [published]

jobs:
  build:
    name: "Build: win64"
    runs-on: windows-2022
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Build firebird-emu
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          qmake .. -config release
          nmake
          New-Item -ItemType Directory -Force firebird-emu | Out-Null
          Move-Item -Force release\firebird-emu.exe firebird-emu\
          windeployqt --qmldir=..\qml --no-qmltooling firebird-emu\firebird-emu.exe

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: firebird-emu-win64
          # Use a wildcard to force a subfolder
          path: "build/*-emu/"
          if-no-files-found: error
