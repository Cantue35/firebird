name: Build for Android

on:
  workflow_dispatch:
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.1" "ndk;26.1.10909125"

      - name: Install Qt 6.8.3 for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Build firebird (qmake)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          mkdir -p build
          cd build
          # Qt 6.8 requires Android API level >= 28 (minSdkVersion).
          # Keep target aligned with the installed platform (android-35).
          qmake .. ANDROID_ABIS="arm64-v8a" ANDROID_MIN_SDK_VERSION=28 ANDROID_TARGET_SDK_VERSION=35
          make -j"$(nproc)" apk_install_target

      - name: Pack APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          cd build
          export PATH="$QT_HOST_PATH/bin:$PATH"
          command -v androiddeployqt
          if [ -n "$ANDROID_KEYSTORE_PWD" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            androiddeployqt --android-platform android-35 --input android-firebird-emu-deployment-settings.json --output android-build --apk firebird-emu.apk --sign keystore.jks firebirdemugh --storepass "$ANDROID_KEYSTORE_PWD"
          else
            androiddeployqt --android-platform android-35 --input android-firebird-emu-deployment-settings.json --output android-build --apk firebird-emu.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firebird-emu-android-arm64
          path: build/firebird-emu.apk
          if-no-files-found: error
